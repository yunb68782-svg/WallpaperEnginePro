        class WallpaperEngineTest {

            @Test
            fun testFpsClampingBoundaries() {
                assertEquals(15, WallpaperConfig(maxFps = 5).getClampedFps())
                assertEquals(45, WallpaperConfig(maxFps = 45).getClampedFps())
                assertEquals(60, WallpaperConfig(maxFps = 144).getClampedFps())
            }

            @Test
            fun testSpeedAndSensitivitiesClamping() {
                val config = WallpaperConfig(
                    playbackSpeed = 0.1f,
                    touchIntensity = 10f,
                    gyroSensitivity = -2f
                )
                assertEquals(0.5f, config.getClampedSpeed(), 0.001f)
                assertEquals(3.0f, config.getClampedTouchIntensity(), 0.001f)
                assertEquals(0.1f, config.getClampedGyroSensitivity(), 0.001f)
            }

            @Test
            fun testEffectiveFpsWithPowerSaveToggle() {
                val highConfig = WallpaperConfig(maxFps = 60, powerSaveMode = true)
                assertEquals(60, highConfig.calculateEffectiveFps(isLowBattery = false))
                assertEquals(15, highConfig.calculateEffectiveFps(isLowBattery = true))

                val noPowerSaveConfig = WallpaperConfig(maxFps = 60, powerSaveMode = false)
                assertEquals(60, noPowerSaveConfig.calculateEffectiveFps(isLowBattery = true))
            }

            @Test
            fun testSensorEvaluatorFourStatesDecision() {
                val modeGame = SensorEvaluator.resolveMode(hasGameRotation = true, hasRotation = true, hasAccel = true)
                assertEquals(SensorMode.GAME_ROTATION_VECTOR, modeGame)

                val modeRot = SensorEvaluator.resolveMode(hasGameRotation = false, hasRotation = true, hasAccel = true)
                assertEquals(SensorMode.ROTATION_VECTOR, modeRot)

                val modeAccel = SensorEvaluator.resolveMode(hasGameRotation = false, hasRotation = false, hasAccel = true)
                assertEquals(SensorMode.ACCELEROMETER_FALLBACK, modeAccel)

                val modeNone = SensorEvaluator.resolveMode(hasGameRotation = false, hasRotation = false, hasAccel = false)
                assertEquals(SensorMode.UNSUPPORTED, modeNone)
            }

            @Test
            fun testBaselineAngleDeltaWithoutFlipping() {
                val deltaNormal = SensorMathUtils.calculateAngleDelta(0.2f, 0.1f)
                assertEquals(0.1f, deltaNormal, 0.001f)

                val currentNearMinusPi = (-PI + 0.01).toFloat()
                val baselineNearPlusPi = (PI - 0.01).toFloat()
                val deltaNearPi = SensorMathUtils.calculateAngleDelta(currentNearMinusPi, baselineNearPlusPi)
                assertEquals(0.02f, deltaNearPi, 0.005f)
            }

            @Test
            fun testActiveWallpaperDeletionFallbackStrictPresetStars() {
                val currentActiveId = "local_custom_video"
                val deletedId = "local_custom_video"

                val mockDb = mutableMapOf(
                    "preset_stars" to WallpaperItem("preset_stars", "默认星空", "path", null, WallpaperType.PARTICLE, "默认"),
                    "other_video" to WallpaperItem("other_video", "其他视频", "path2", null, WallpaperType.VIDEO, "本地"),
