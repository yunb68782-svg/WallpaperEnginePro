name: Build Wallpaper Engine Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 现场生成全套 Android 源码与编译配置 (单行转义安全版)
      run: |
        python3 - << 'EOF'
        import os

        def write_file(path, content):
            os.makedirs(os.path.dirname(path), exist_ok=True)
            with open(path, 'w', encoding='utf-8') as f:
                f.write(content.strip() + '\n')

        write_file('settings.gradle', 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "WallpaperEngine"\ninclude \':app\'')

        write_file('build.gradle', 'plugins {\n    id \'com.android.application\' version \'8.2.2\' apply false\n    id \'org.jetbrains.kotlin.android\' version \'1.9.22\' apply false\n}')

        write_file('gradle.properties', 'org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true')

        write_file('app/build.gradle', 'plugins {\n    id \'com.android.application\'\n    id \'org.jetbrains.kotlin.android\'\n}\n\nandroid {\n    namespace \'com.example.wallpaperengine\'\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.example.wallpaperengine"\n        minSdk 26\n        targetSdk 34\n        versionCode 5\n        versionName "2.2.0"\n        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile(\'proguard-android-optimize.txt\'), \'proguard-rules.pro\'\n        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \'17\'\n    }\n    buildFeatures {\n        compose true\n    }\n    composeOptions {\n        kotlinCompilerExtensionVersion \'1.5.8\'\n    }\n    packaging {\n        resources {\n            excludes += \'/META-INF/{AL2.0,LGPL2.1}\'\n        }\n    }\n}\n\ndependencies {\n    implementation platform(\'androidx.compose:compose-bom:2024.02.01\')\n    implementation \'androidx.core:core-ktx:1.12.0\'\n    implementation \'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0\'\n    implementation \'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0\'\n    implementation \'androidx.activity:activity-compose:1.8.2\'\n    implementation \'androidx.compose.ui:ui\'\n    implementation \'androidx.compose.ui:ui-graphics\'\n    implementation \'androidx.compose.ui:ui-tooling-preview\'\n    implementation \'androidx.compose.material3:material3\'\n    implementation \'androidx.compose.material:material-icons-extended\'\n    implementation \'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3\'\n    testImplementation \'junit:junit:4.13.2\'\n    testImplementation \'org.xerial:sqlite-jdbc:3.45.1.0\'\n}')

        write_file('app/proguard-rules.pro', '-keepclassmembers class com.example.wallpaperengine.domain.model.** { *; }')

        write_file('app/src/main/AndroidManifest.xml', '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.SET_WALLPAPER" />\n    <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />\n    <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="false" />\n    <application android:allowBackup="true" android:icon="@drawable/ic_launcher" android:label="@string/app_name" android:roundIcon="@drawable/ic_launcher" android:supportsRtl="true" android:theme="@style/Theme.WallpaperEngine">\n        <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n        <service android:name=".wallpaper.LiveWallpaperService" android:enabled="true" android:exported="true" android:label="@string/wallpaper_service_label" android:permission="android.permission.BIND_WALLPAPER">\n            <intent-filter>\n                <action android:name="android.service.wallpaper.WallpaperService" />\n            </intent-filter>\n            <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />\n        </service>\n    </application>\n</manifest>')

        write_file('app/src/main/res/xml/wallpaper.xml', '<?xml version="1.0" encoding="utf-8"?>\n<wallpaper xmlns:android="http://schemas.android.com/apk/res/android" android:thumbnail="@drawable/ic_launcher" android:description="@string/wallpaper_desc" />')

        write_file('app/src/main/res/values/strings.xml', '<resources>\n    <string name="app_name">Wallpaper Engine Pro</string>\n    <string name="wallpaper_service_label">Wallpaper Engine Pro 动态壁纸</string>\n    <string name="wallpaper_desc">基于 Android 原生媒体解码与传感器能力的动态壁纸引擎</string>\n</resources>')

        write_file('app/src/main/res/values/themes.xml', '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.WallpaperEngine" parent="android:Theme.Material.NoActionBar" />\n</resources>')

        write_file('app/src/main/res/drawable/ic_launcher.xml', '<vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">\n    <path android:pathData="M0,0h108v108h-108z">\n        <aapt:attr name="android:fillColor">\n            <gradient android:startX="0" android:startY="0" android:endX="108" android:endY="108" android:type="linear">\n                <item android:offset="0.0" android:color="#1A1F2C" />\n                <item android:offset="1.0" android:color="#0B0D13" />\n            </gradient>\n        </aapt:attr>\n    </path>\n    <path android:fillColor="#00E5FF" android:pathData="M54,20 L84,80 L24,80 Z" />\n    <path android:fillColor="#7C4DFF" android:pathData="M54,38 L74,78 L34,78 Z" />\n</vector>')

        print("基础配置文件生成完毕！")
        EOF

    - name: 初始化并赋予 Gradle Wrapper 权限
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    - name: 执行单元测试与编译打包
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: 上传编译生成的 Debug APK 制品
      uses: actions/upload-artifact@v4
      with:
        name: WallpaperEngine_Pro_Fixed_APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
