                assertTrue("视频支持陀螺仪视差", videoItem.supportsGyro)
                assertTrue("粒子支持陀螺仪视差", particleItem.supportsGyro)
                assertFalse("音频引擎未接入，supportsAudio 恒为 false", videoItem.supportsAudio)
                assertFalse("音频引擎未接入，supportsAudio 恒为 false", particleItem.supportsAudio)
            }

            @Test
            fun testScaleModeConfigMappingParametersOnly() {
                val cropConfig = WallpaperConfig(scaleMode = 0)
                val fitConfig = WallpaperConfig(scaleMode = 1)
                val stretchConfig = WallpaperConfig(scaleMode = 2)

                assertEquals(0, cropConfig.scaleMode)
                assertEquals(1, fitConfig.scaleMode)
                assertEquals(2, stretchConfig.scaleMode)
