                        WallpaperItem("shader_galaxy", "旋转星系螺旋", "shader://galaxy", null, WallpaperType.SHADER, "太空", true, 0L),
                        WallpaperItem("shader_aurora", "绚烂极光波浪", "shader://aurora", null, WallpaperType.SHADER, "自然", false, 0L),
                        WallpaperItem("shader_plasma", "能量等离子体", "shader://plasma", null, WallpaperType.SHADER, "抽象", true, 0L)
                    )
                    presets.forEach { db.insertOrUpdate(it) }
                    sp.edit().putString(KEY_ACTIVE_ID, DEFAULT_FALLBACK_PRESET.id).apply()
                }
            }

            suspend fun getAllWallpapersAsync(): List<WallpaperItem> = withContext(Dispatchers.IO) {
                initializePresetsIfEmpty()
                db.getAll()
            }

            suspend fun saveWallpaperAsync(item: WallpaperItem): Unit = withContext(Dispatchers.IO) {
                db.insertOrUpdate(item)
                val active = getActiveWallpaper()
                if (active.id == item.id) {
                    WallpaperLiveBridge.notifyConfigUpdated(item.id, item.config)
                    WallpaperLiveBridge.notifyRealtimeScaleChanged(item.config.customScale, item.config.scaleMode)
                }
                Unit
            }

            suspend fun deleteWallpaperAsync(id: String): Unit = withContext(Dispatchers.IO) {
                val itemToDelete = db.getById(id)
                db.delete(id)

                if (itemToDelete != null && itemToDelete.type == WallpaperType.VIDEO) {
                    try {
                        val f = File(itemToDelete.path)
                        if (f.exists()) f.delete()
                    } catch (e: Exception) {}
                }

                val currentActiveId = sp.getString(KEY_ACTIVE_ID, DEFAULT_FALLBACK_PRESET.id)
                if (currentActiveId == id) {
                    switchToNextWallpaper()
                }
                Unit
            }

            @Synchronized
            fun getActiveWallpaper(): WallpaperItem {
                val activeId = sp.getString(KEY_ACTIVE_ID, DEFAULT_FALLBACK_PRESET.id) ?: DEFAULT_FALLBACK_PRESET.id
                val item = db.getById(activeId)
                if (item != null) return item

                initializePresetsIfEmpty()
                return db.getById(DEFAULT_FALLBACK_PRESET.id) ?: DEFAULT_FALLBACK_PRESET
            }

            @Synchronized
            fun setActiveWallpaperId(id: String): Boolean {
                val item = db.getById(id) ?: return false
                sp.edit().putString(KEY_ACTIVE_ID, id).apply()
                val updated = item.copy(lastUsedTime = System.currentTimeMillis())
                db.insertOrUpdate(updated)
                WallpaperLiveBridge.notifyActiveWallpaperChanged(updated)
                return true
            }

            @Synchronized
            fun switchToNextWallpaper() {
                val list = db.getAll()
                if (list.isEmpty()) return
                val currentId = sp.getString(KEY_ACTIVE_ID, list[0].id)
                val currentIndex = list.indexOfFirst { it.id == currentId }
                val nextIndex = if (currentIndex >= 0 && currentIndex < list.size - 1) currentIndex + 1 else 0
                setActiveWallpaperId(list[nextIndex].id)
            }

            @Synchronized
            fun checkAndPerformAutoRotate(force: Boolean = false) {
                if (!isAutoRotateEnabled()) return
                val now = System.currentTimeMillis()
                val intervalMs = getRotateMinutes() * 60 * 1000L
                val last = getLastRotateTimestamp()

                if (force || now - last >= intervalMs || last == 0L) {
                    setLastRotateTimestamp(now)
                    switchToNextWallpaper()
                }
            }

            fun isAutoRotateEnabled(): Boolean = sp.getBoolean(KEY_AUTO_ROTATE, false)
            fun setAutoRotateEnabled(enabled: Boolean) = sp.edit().putBoolean(KEY_AUTO_ROTATE, enabled).apply()

            fun getRotateMinutes(): Int = sp.getInt(KEY_ROTATE_MINUTES, 15)
            fun setRotateMinutes(min: Int) = sp.edit().putInt(KEY_ROTATE_MINUTES, min).apply()

            fun getLastRotateTimestamp(): Long = sp.getLong(KEY_LAST_ROTATE_TIMESTAMP, 0L)
            fun setLastRotateTimestamp(time: Long) = sp.edit().putLong(KEY_LAST_ROTATE_TIMESTAMP, time).apply()

            fun isDoubleTapEnabled(): Boolean = sp.getBoolean(KEY_DOUBLE_TAP, true)
            fun setDoubleTapEnabled(enabled: Boolean) = sp.edit().putBoolean(KEY_DOUBLE_TAP, enabled).apply()

            suspend fun downloadOnlineWallpaperAsync(videoUrl: String, title: String): Result<WallpaperItem> = withContext(Dispatchers.IO) {
                try {
                    val destDir = File(context.filesDir, "imported_wallpapers")
                    if (!destDir.exists()) destDir.mkdirs()
                    val targetFile = File(destDir, "online_${System.currentTimeMillis()}.mp4")

                    val conn = (URL(videoUrl).openConnection() as HttpURLConnection).apply {
                        connectTimeout = 15000
                        readTimeout = 25000
                        instanceFollowRedirects = true
                    }
                    conn.connect()

                    conn.inputStream.use { input ->
                        FileOutputStream(targetFile).use { output ->
                            val buffer = ByteArray(32768)
                            var len: Int
                            while (input.read(buffer).also { len = it } != -1) {
                                output.write(buffer, 0, len)
                            }
                        }
                    }

                    val item = WallpaperItem(
                        id = "online_${System.currentTimeMillis()}",
                        name = title.ifBlank { "在线高清壁纸" },
                        path = targetFile.absolutePath,
                        thumbnailPath = null,
                        type = WallpaperType.VIDEO,
                        category = "网络精选",
                        isFavorite = true,
                        lastUsedTime = System.currentTimeMillis()
                    )
                    db.insertOrUpdate(item)
                    Result.success(item)
                } catch (e: Exception) {
                    Result.failure(e)
                }
            }
        }
