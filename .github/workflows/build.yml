        files['app/src/main/java/com/example/wallpaperengine/wallpaper/LiveWallpaperService.kt'] = '''package com.example.wallpaperengine.wallpaper

        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.os.BatteryManager
        import android.service.wallpaper.WallpaperService
        import android.view.MotionEvent
        import android.view.SurfaceHolder
        import com.example.wallpaperengine.data.repository.WallpaperRepository
        import com.example.wallpaperengine.domain.engine.ParticleWallpaperEngine
        import com.example.wallpaperengine.domain.engine.ShaderWallpaperEngine
        import com.example.wallpaperengine.domain.engine.VideoWallpaperEngine
        import com.example.wallpaperengine.domain.engine.WallpaperEngine
        import com.example.wallpaperengine.domain.model.WallpaperConfig
        import com.example.wallpaperengine.domain.model.WallpaperItem
        import com.example.wallpaperengine.domain.model.WallpaperType
        import com.example.wallpaperengine.domain.sensor.SensorParallaxManager
        import com.example.wallpaperengine.domain.sync.WallpaperLiveBridge
        import java.util.concurrent.CopyOnWriteArraySet
        import kotlin.math.abs

        class LiveWallpaperService : WallpaperService() {

            private lateinit var repository: WallpaperRepository
            private val activeEngines = CopyOnWriteArraySet<LiveEngine>()

            private val globalReceiver = object : BroadcastReceiver() {
                override fun onReceive(context: Context?, intent: Intent?) {
                    when (intent?.action) {
                        Intent.ACTION_BATTERY_CHANGED -> {
                            val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, 100)
                            val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                            val percent = (level * 100) / scale
                            activeEngines.forEach { it.notifyBatteryChanged(percent, percent <= 20) }
                        }
                        Intent.ACTION_TIME_TICK, Intent.ACTION_SCREEN_ON -> {
                            repository.checkAndPerformAutoRotate()
                        }
                    }
                }
            }

            override fun onCreate() {
                super.onCreate()
                repository = WallpaperRepository(applicationContext)
                repository.initializePresetsIfEmpty()

                val filter = IntentFilter().apply {
                    addAction(Intent.ACTION_BATTERY_CHANGED)
                    addAction(Intent.ACTION_TIME_TICK)
                    addAction(Intent.ACTION_SCREEN_ON)
                }
                registerReceiver(globalReceiver, filter)
            }

            override fun onDestroy() {
                super.onDestroy()
                try { unregisterReceiver(globalReceiver) } catch (e: Exception) {}
                activeEngines.clear()
            }

            override fun onCreateEngine(): Engine = LiveEngine()

            inner class LiveEngine : Engine(), WallpaperLiveBridge.WallpaperUpdateListener {

                private var engine: WallpaperEngine? = null
                private var parallaxManager: SensorParallaxManager? = null
                private var isVisibleState = false

                private var lastTapDownTime = 0L
                private var lastTapX = 0f
                private var lastTapY = 0f

                fun notifyBatteryChanged(level: Int, isLow: Boolean) {
                    engine?.onBattery(level, isLow)
                }

                override fun onCreate(surfaceHolder: SurfaceHolder) {
                    super.onCreate(surfaceHolder)
                    setTouchEventsEnabled(true)

                    activeEngines.add(this)
                    WallpaperLiveBridge.registerListener(this)
                    parallaxManager = SensorParallaxManager(applicationContext).apply {
                        onSensorTiltUpdate = { x, y -> engine?.onSensor(x, y) }
                    }
                }

                override fun onSurfaceCreated(holder: SurfaceHolder) {
                    super.onSurfaceCreated(holder)
                    reloadEngine(holder)
                }

                private fun reloadEngine(holder: SurfaceHolder) {
                    engine?.onDestroy()
                    val activeWp = repository.getActiveWallpaper()
                    val width = holder.surfaceFrame.width()
                    val height = holder.surfaceFrame.height()

                    engine = when (activeWp.type) {
                        WallpaperType.VIDEO -> VideoWallpaperEngine(applicationContext, activeWp.path, activeWp.config)
                        WallpaperType.SHADER -> {
                            val preset = activeWp.path.removePrefix("shader://")
                            ShaderWallpaperEngine(preset, activeWp.config)
                        }
                        else -> {
                            val subType = activeWp.path.removePrefix("particle://")
                            ParticleWallpaperEngine(subType, activeWp.config)
                        }
                    }

                    engine?.onCreate(holder, width, height)
                    engine?.updateCustomScale(activeWp.config.getClampedScale(), activeWp.config.scaleMode)
                    if (isVisibleState) engine?.onVisibilityChanged(true)
                }

                override fun onConfigUpdated(wallpaperId: String, newConfig: WallpaperConfig) {
                    val active = repository.getActiveWallpaper()
                    if (active.id == wallpaperId) {
                        engine?.updateConfig(newConfig)
                        engine?.updateCustomScale(newConfig.getClampedScale(), newConfig.scaleMode)
                    }
                }

                override fun onRealtimeScaleChanged(scale: Float, mode: Int) {
                    engine?.updateCustomScale(scale, mode)
                }

                override fun onActiveWallpaperChanged(newActiveItem: WallpaperItem) {
                    surfaceHolder?.let { reloadEngine(it) }
                }

                override fun onDoubleTapSwitchTriggered() {}

                override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                    super.onSurfaceChanged(holder, format, width, height)
                    engine?.onSurfaceChanged(width, height)
                }

                override fun onVisibilityChanged(visible: Boolean) {
                    super.onVisibilityChanged(visible)
                    this.isVisibleState = visible
                    engine?.onVisibilityChanged(visible)
                    if (visible) {
                        parallaxManager?.start()
                    } else {
                        parallaxManager?.stop()
                    }
                }

                override fun onTouchEvent(event: MotionEvent?) {
                    super.onTouchEvent(event)
                    if (event == null) return

                    engine?.onTouch(event)

                    if (event.action == MotionEvent.ACTION_DOWN) {
                        val now = System.currentTimeMillis()
                        val dx = abs(event.x - lastTapX)
                        val dy = abs(event.y - lastTapY)
                        if (now - lastTapDownTime < 350L && dx < 80f && dy < 80f && repository.isDoubleTapEnabled()) {
                            repository.switchToNextWallpaper()
                            lastTapDownTime = 0L
                        } else {
                            lastTapDownTime = now
                            lastTapX = event.x
                            lastTapY = event.y
                        }
                    }
                }

                override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                    super.onSurfaceDestroyed(holder)
                    parallaxManager?.stop()
                    engine?.onDestroy()
                    engine = null
                }

                override fun onDestroy() {
                    super.onDestroy()
                    activeEngines.remove(this)
                    WallpaperLiveBridge.unregisterListener(this)
                    parallaxManager?.stop()
                    parallaxManager = null
                    engine?.onDestroy()
                    engine = null
                }
            }
        }
        '''

