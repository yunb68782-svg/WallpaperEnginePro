        files['app/src/main/java/com/example/wallpaperengine/ui/viewmodel/WallpaperViewModel.kt'] = '''package com.example.wallpaperengine.ui.viewmodel

        import android.content.Context
        import android.net.Uri
        import androidx.compose.runtime.getValue
        import androidx.compose.runtime.mutableIntStateOf
        import androidx.compose.runtime.mutableStateOf
        import androidx.compose.runtime.setValue
        import androidx.lifecycle.ViewModel
        import androidx.lifecycle.viewModelScope
        import com.example.wallpaperengine.data.repository.WallpaperRepository
        import com.example.wallpaperengine.domain.media.VideoImportHelper
        import com.example.wallpaperengine.domain.model.WallpaperItem
        import kotlinx.coroutines.launch

        class WallpaperViewModel(private val repository: WallpaperRepository) : ViewModel() {

            var allWallpapers by mutableStateOf<List<WallpaperItem>>(emptyList())
                private set

            var favoriteWallpapers by mutableStateOf<List<WallpaperItem>>(emptyList())
                private set

            var activeWallpaper by mutableStateOf(repository.getActiveWallpaper())
                private set

            var selectedTab by mutableIntStateOf(0)
            var editingItem by mutableStateOf<WallpaperItem?>(null)
            var toastMessage by mutableStateOf<String?>(null)

            init {
                refresh()
            }

            fun refresh() {
                viewModelScope.launch {
                    allWallpapers = repository.getAllWallpapersAsync()
                    favoriteWallpapers = repository.getFavoritesAsync()
                    activeWallpaper = repository.getActiveWallpaper()
                }
            }

            fun applyWallpaper(id: String) {
                val success = repository.setActiveWallpaperId(id)
                if (success) {
                    refresh()
                    toastMessage = "已切换当前壁纸！"
                } else {
                    toastMessage = "应用失败：壁纸不存在或已被删除"
                }
            }

            fun saveConfig(item: WallpaperItem) {
                viewModelScope.launch {
                    repository.saveWallpaperAsync(item)
                    editingItem = null
                    refresh()
                }
            }

            fun deleteWallpaper(id: String) {
                viewModelScope.launch {
                    repository.deleteWallpaperAsync(id)
                    if (editingItem?.id == id) {
                        editingItem = null
                    }
                    refresh()
                    toastMessage = "壁纸已删除"
                }
            }

            fun importVideo(context: Context, uri: Uri) {
                viewModelScope.launch {
                    val res = VideoImportHelper.importVideo(context, uri)
                    if (res.success && res.item != null) {
                        repository.saveWallpaperAsync(res.item)
                        toastMessage = "导入成功：${res.item.name}"
                        refresh()
                    } else {
                        toastMessage = res.errorMessage ?: "导入失败"
                    }
                }
            }
        }
        '''

