        files['app/src/main/java/com/example/wallpaperengine/data/database/WallpaperDatabase.kt'] = '''package com.example.wallpaperengine.data.database

        import android.content.ContentValues
        import android.content.Context
        import android.database.sqlite.SQLiteDatabase
        import android.database.sqlite.SQLiteOpenHelper
        import com.example.wallpaperengine.domain.model.WallpaperConfig
        import com.example.wallpaperengine.domain.model.WallpaperItem
        import com.example.wallpaperengine.domain.model.WallpaperType

        class WallpaperDatabase(context: Context) : SQLiteOpenHelper(context, "wallpaper.db", null, 6) {

            companion object {
                const val TABLE_NAME = "wallpapers"
                const val COL_ID = "id"
                const val COL_NAME = "name"
                const val COL_PATH = "path"
                const val COL_THUMBNAIL = "thumbnailPath"
                const val COL_TYPE = "type"
                const val COL_CATEGORY = "category"
                const val COL_FAVORITE = "isFavorite"
                const val COL_LAST_USED = "lastUsedTime"
                const val COL_MAX_FPS = "maxFps"
                const val COL_SPEED = "playbackSpeed"
                const val COL_MUTED = "isMuted"
                const val COL_SCALE = "scaleMode"
                const val COL_TOUCH_INTERACTIVE = "touchInteractive"
                const val COL_TOUCH_INTENSITY = "touchIntensity"
                const val COL_GYRO_ENABLED = "gyroEnabled"
                const val COL_GYRO_SENSITIVITY = "gyroSensitivity"
                const val COL_DAY_NIGHT = "dayNightEnabled"
                const val COL_POWER_SAVE = "powerSaveMode"
                const val COL_CUSTOM_SCALE = "customScale"
                const val COL_VOLUME = "volume"

                fun executeV4ToV5Migration(executor: SqlExecutor) {
                    val columns = executor.queryTableColumns(TABLE_NAME)
                    if (!columns.contains("supportsTouch") && !columns.contains("supportsGyro") && !columns.contains("supportsAudio")) {
                        return
                    }

                    executor.execSQL("""
                        CREATE TABLE ${TABLE_NAME}_new (
                            $COL_ID TEXT PRIMARY KEY,
                            $COL_NAME TEXT NOT NULL,
                            $COL_PATH TEXT NOT NULL,
                            $COL_THUMBNAIL TEXT,
                            $COL_TYPE TEXT NOT NULL,
                            $COL_CATEGORY TEXT NOT NULL,
                            $COL_FAVORITE INTEGER NOT NULL DEFAULT 0,
                            $COL_LAST_USED INTEGER NOT NULL DEFAULT 0,
                            $COL_MAX_FPS INTEGER NOT NULL DEFAULT 30,
                            $COL_SPEED REAL NOT NULL DEFAULT 1.0,
                            $COL_MUTED INTEGER NOT NULL DEFAULT 1,
                            $COL_SCALE INTEGER NOT NULL DEFAULT 0,
                            $COL_TOUCH_INTERACTIVE INTEGER NOT NULL DEFAULT 1,
                            $COL_TOUCH_INTENSITY REAL NOT NULL DEFAULT 1.0,
                            $COL_GYRO_ENABLED INTEGER NOT NULL DEFAULT 1,
                            $COL_GYRO_SENSITIVITY REAL NOT NULL DEFAULT 1.0,
                            $COL_DAY_NIGHT INTEGER NOT NULL DEFAULT 1,
                            $COL_POWER_SAVE INTEGER NOT NULL DEFAULT 1
                        )
                    """.trimIndent())

                    executor.execSQL("""
                        INSERT INTO ${TABLE_NAME}_new ($COL_ID, $COL_NAME, $COL_PATH, $COL_THUMBNAIL, $COL_TYPE, $COL_CATEGORY,
                            $COL_FAVORITE, $COL_LAST_USED, $COL_MAX_FPS, $COL_SPEED, $COL_MUTED, $COL_SCALE,
                            $COL_TOUCH_INTERACTIVE, $COL_TOUCH_INTENSITY, $COL_GYRO_ENABLED, $COL_GYRO_SENSITIVITY,
                            $COL_DAY_NIGHT, $COL_POWER_SAVE)
                        SELECT $COL_ID, $COL_NAME, $COL_PATH, $COL_THUMBNAIL, $COL_TYPE, $COL_CATEGORY,
                            $COL_FAVORITE, $COL_LAST_USED, $COL_MAX_FPS, $COL_SPEED, $COL_MUTED, $COL_SCALE,
                            $COL_TOUCH_INTERACTIVE, $COL_TOUCH_INTENSITY, $COL_GYRO_ENABLED, $COL_GYRO_SENSITIVITY,
                            $COL_DAY_NIGHT, $COL_POWER_SAVE
                        FROM $TABLE_NAME
                    """.trimIndent())

                    executor.execSQL("DROP TABLE $TABLE_NAME")
                    executor.execSQL("ALTER TABLE ${TABLE_NAME}_new RENAME TO $TABLE_NAME")
                }

                fun executeV5ToV6Migration(executor: SqlExecutor) {
                    val columns = executor.queryTableColumns(TABLE_NAME)
                    if (!columns.contains(COL_CUSTOM_SCALE)) {
                        executor.execSQL("ALTER TABLE $TABLE_NAME ADD COLUMN $COL_CUSTOM_SCALE REAL NOT NULL DEFAULT 1.0")
                    }
                    if (!columns.contains(COL_VOLUME)) {
                        executor.execSQL("ALTER TABLE $TABLE_NAME ADD COLUMN $COL_VOLUME REAL NOT NULL DEFAULT 1.0")
                    }
                }
            }

            override fun onCreate(db: SQLiteDatabase) {
                val sql = """
                    CREATE TABLE $TABLE_NAME (
                        $COL_ID TEXT PRIMARY KEY,
                        $COL_NAME TEXT NOT NULL,
                        $COL_PATH TEXT NOT NULL,
                        $COL_THUMBNAIL TEXT,
                        $COL_TYPE TEXT NOT NULL,
                        $COL_CATEGORY TEXT NOT NULL,
                        $COL_FAVORITE INTEGER NOT NULL DEFAULT 0,
                        $COL_LAST_USED INTEGER NOT NULL DEFAULT 0,
                        $COL_MAX_FPS INTEGER NOT NULL DEFAULT 30,
                        $COL_SPEED REAL NOT NULL DEFAULT 1.0,
                        $COL_MUTED INTEGER NOT NULL DEFAULT 1,
                        $COL_SCALE INTEGER NOT NULL DEFAULT 0,
                        $COL_TOUCH_INTERACTIVE INTEGER NOT NULL DEFAULT 1,
                        $COL_TOUCH_INTENSITY REAL NOT NULL DEFAULT 1.0,
                        $COL_GYRO_ENABLED INTEGER NOT NULL DEFAULT 1,
                        $COL_GYRO_SENSITIVITY REAL NOT NULL DEFAULT 1.0,
                        $COL_DAY_NIGHT INTEGER NOT NULL DEFAULT 1,
                        $COL_POWER_SAVE INTEGER NOT NULL DEFAULT 1,
                        $COL_CUSTOM_SCALE REAL NOT NULL DEFAULT 1.0,
                        $COL_VOLUME REAL NOT NULL DEFAULT 1.0
                    )
                """.trimIndent()
                db.execSQL(sql)
            }

            override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                val exec = object : SqlExecutor {
                    override fun execSQL(sql: String) = db.execSQL(sql)
                    override fun queryTableColumns(tableName: String): Set<String> {
                        val columns = mutableSetOf<String>()
                        db.rawQuery("PRAGMA table_info($tableName)", null).use { cursor ->
                            val index = cursor.getColumnIndex("name")
                            while (cursor.moveToNext()) {
                                columns.add(cursor.getString(index))
                            }
                        }
                        return columns
                    }
                }

                if (oldVersion < 5) {
                    executeV4ToV5Migration(exec)
                }
                if (oldVersion < 6) {
                    executeV5ToV6Migration(exec)
                }
            }

            fun getAll(): List<WallpaperItem> {
                val list = mutableListOf<WallpaperItem>()
                readableDatabase.rawQuery("SELECT * FROM $TABLE_NAME", null).use { cursor ->
                    while (cursor.moveToNext()) {
                        list.add(readItem(cursor))
                    }
                }
                return list
            }

            fun getById(id: String): WallpaperItem? {
                readableDatabase.rawQuery("SELECT * FROM $TABLE_NAME WHERE $COL_ID = ?", arrayOf(id)).use { cursor ->
                    return if (cursor.moveToFirst()) readItem(cursor) else null
                }
            }

            fun insertOrUpdate(item: WallpaperItem) {
                val values = ContentValues().apply {
                    put(COL_ID, item.id)
                    put(COL_NAME, item.name)
                    put(COL_PATH, item.path)
                    put(COL_THUMBNAIL, item.thumbnailPath)
                    put(COL_TYPE, item.type.name)
                    put(COL_CATEGORY, item.category)
                    put(COL_FAVORITE, if (item.isFavorite) 1 else 0)
                    put(COL_LAST_USED, item.lastUsedTime)
                    put(COL_MAX_FPS, item.config.maxFps)
                    put(COL_SPEED, item.config.playbackSpeed)
                    put(COL_MUTED, if (item.config.isMuted) 1 else 0)
                    put(COL_SCALE, item.config.scaleMode)
                    put(COL_TOUCH_INTERACTIVE, if (item.config.touchInteractive) 1 else 0)
                    put(COL_TOUCH_INTENSITY, item.config.touchIntensity)
                    put(COL_GYRO_ENABLED, if (item.config.gyroEnabled) 1 else 0)
                    put(COL_GYRO_SENSITIVITY, item.config.gyroSensitivity)
                    put(COL_DAY_NIGHT, if (item.config.dayNightEnabled) 1 else 0)
                    put(COL_POWER_SAVE, if (item.config.powerSaveMode) 1 else 0)
                    put(COL_CUSTOM_SCALE, item.config.customScale)
                    put(COL_VOLUME, item.config.volume)
                }
                writableDatabase.insertWithOnConflict(TABLE_NAME, null, values, SQLiteDatabase.CONFLICT_REPLACE)
            }

            fun delete(id: String) {
                writableDatabase.delete(TABLE_NAME, "$COL_ID = ?", arrayOf(id))
            }

            private fun readItem(cursor: android.database.Cursor): WallpaperItem {
                val id = cursor.getString(cursor.getColumnIndexOrThrow(COL_ID))
                val name = cursor.getString(cursor.getColumnIndexOrThrow(COL_NAME))
                val path = cursor.getString(cursor.getColumnIndexOrThrow(COL_PATH))
                val thumbnail = cursor.getString(cursor.getColumnIndexOrThrow(COL_THUMBNAIL))
                val type = WallpaperType.valueOf(cursor.getString(cursor.getColumnIndexOrThrow(COL_TYPE)))
                val category = cursor.getString(cursor.getColumnIndexOrThrow(COL_CATEGORY))
                val favorite = cursor.getInt(cursor.getColumnIndexOrThrow(COL_FAVORITE)) == 1
                val lastUsed = cursor.getLong(cursor.getColumnIndexOrThrow(COL_LAST_USED))
                val maxFps = cursor.getInt(cursor.getColumnIndexOrThrow(COL_MAX_FPS))
                val speed = cursor.getFloat(cursor.getColumnIndexOrThrow(COL_SPEED))
                val muted = cursor.getInt(cursor.getColumnIndexOrThrow(COL_MUTED)) == 1
                val scale = cursor.getInt(cursor.getColumnIndexOrThrow(COL_SCALE))
                val touchInteractive = cursor.getInt(cursor.getColumnIndexOrThrow(COL_TOUCH_INTERACTIVE)) == 1
                val touchIntensity = cursor.getFloat(cursor.getColumnIndexOrThrow(COL_TOUCH_INTENSITY))
                val gyroEnabled = cursor.getInt(cursor.getColumnIndexOrThrow(COL_GYRO_ENABLED)) == 1
                val gyroSensitivity = cursor.getFloat(cursor.getColumnIndexOrThrow(COL_GYRO_SENSITIVITY))
                val dayNight = cursor.getInt(cursor.getColumnIndexOrThrow(COL_DAY_NIGHT)) == 1
                val powerSave = cursor.getInt(cursor.getColumnIndexOrThrow(COL_POWER_SAVE)) == 1

                val customScale = try {
                    cursor.getFloat(cursor.getColumnIndexOrThrow(COL_CUSTOM_SCALE))
                } catch (e: Exception) { 1.0f }

                val vol = try {
                    cursor.getFloat(cursor.getColumnIndexOrThrow(COL_VOLUME))
                } catch (e: Exception) { 1.0f }

                val config = WallpaperConfig(
                    maxFps = maxFps,
                    playbackSpeed = speed,
                    isMuted = muted,
                    volume = vol,
                    scaleMode = scale,
                    customScale = customScale,
                    touchInteractive = touchInteractive,
                    touchIntensity = touchIntensity,
                    gyroEnabled = gyroEnabled,
                    gyroSensitivity = gyroSensitivity,
                    dayNightEnabled = dayNight,
                    powerSaveMode = powerSave
                )
                return WallpaperItem(id, name, path, thumbnail, type, category, favorite, lastUsed, config)
            }
        }
        '''

