        import android.content.Context
        import android.net.Uri
        import androidx.compose.runtime.getValue
        import androidx.compose.runtime.mutableFloatStateOf
        import androidx.compose.runtime.mutableIntStateOf
        import androidx.compose.runtime.mutableStateOf
        import androidx.compose.runtime.setValue
        import androidx.lifecycle.ViewModel
        import androidx.lifecycle.viewModelScope
        import com.example.wallpaperengine.data.repository.WallpaperRepository
        import com.example.wallpaperengine.domain.media.VideoImportHelper
        import com.example.wallpaperengine.domain.model.WallpaperConfig
        import com.example.wallpaperengine.domain.model.WallpaperItem
        import com.example.wallpaperengine.domain.sync.WallpaperLiveBridge
        import kotlinx.coroutines.launch

        class WallpaperViewModel(private val repository: WallpaperRepository) : ViewModel() {

            var allWallpapers by mutableStateOf<List<WallpaperItem>>(emptyList())
                private set

            var activeWallpaper by mutableStateOf(repository.getActiveWallpaper())
                private set

            var previewWallpaper by mutableStateOf(repository.getActiveWallpaper())

            var selectedTab by mutableIntStateOf(0)
            var toastMessage by mutableStateOf<String?>(null)
            var isDownloading by mutableStateOf(false)

            var tuningScale by mutableFloatStateOf(1.0f)
            var tuningSpeed by mutableFloatStateOf(1.0f)
            var tuningVolume by mutableFloatStateOf(1.0f)
            var tuningMuted by mutableStateOf(true)
            var tuningScaleMode by mutableIntStateOf(0)
            var tuningGyroEnabled by mutableStateOf(true)
            var tuningTouchEnabled by mutableStateOf(true)
            var tuningFps by mutableIntStateOf(30)

            var autoRotateEnabled by mutableStateOf(repository.isAutoRotateEnabled())
            var rotateMinutes by mutableIntStateOf(repository.getRotateMinutes())
            var doubleTapEnabled by mutableStateOf(repository.isDoubleTapEnabled())

            init {
                refresh()
            }

            fun refresh() {
                viewModelScope.launch {
                    allWallpapers = repository.getAllWallpapersAsync()
                    val active = repository.getActiveWallpaper()
                    activeWallpaper = active
                    if (previewWallpaper.id.isEmpty() || allWallpapers.none { it.id == previewWallpaper.id }) {
                        selectForPreview(active)
                    }
                }
            }

            fun selectForPreview(item: WallpaperItem) {
                previewWallpaper = item
                tuningScale = item.config.getClampedScale()
                tuningSpeed = item.config.getClampedSpeed()
                tuningVolume = item.config.getClampedVolume()
                tuningMuted = item.config.isMuted
                tuningScaleMode = item.config.scaleMode
                tuningGyroEnabled = item.config.gyroEnabled
                tuningTouchEnabled = item.config.touchInteractive
                tuningFps = item.config.maxFps
            }

            fun updatePreviewParam(
                scale: Float = tuningScale,
                speed: Float = tuningSpeed,
                volume: Float = tuningVolume,
                muted: Boolean = tuningMuted,
                mode: Int = tuningScaleMode,
                gyro: Boolean = tuningGyroEnabled,
                touch: Boolean = tuningTouchEnabled,
                fps: Int = tuningFps
            ) {
                tuningScale = scale
                tuningSpeed = speed
                tuningVolume = volume
                tuningMuted = muted
                tuningScaleMode = mode
                tuningGyroEnabled = gyro
                tuningTouchEnabled = touch
                tuningFps = fps

                val newConfig = previewWallpaper.config.copy(
                    customScale = scale,
                    playbackSpeed = speed,
                    volume = volume,
                    isMuted = muted,
                    scaleMode = mode,
                    gyroEnabled = gyro,
                    touchInteractive = touch,
                    maxFps = fps
                )
                previewWallpaper = previewWallpaper.copy(config = newConfig)

                viewModelScope.launch {
                    repository.saveWallpaperAsync(previewWallpaper)
                }

                if (previewWallpaper.id == activeWallpaper.id) {
                    WallpaperLiveBridge.notifyConfigUpdated(previewWallpaper.id, newConfig)
                    WallpaperLiveBridge.notifyRealtimeScaleChanged(scale, mode)
                }
            }

            fun applyWallpaper(id: String) {
                if (repository.setActiveWallpaperId(id)) {
                    refresh()
                    toastMessage = "已设为当前壁纸！"
                }
            }

            fun deleteWallpaper(id: String) {
                viewModelScope.launch {
                    repository.deleteWallpaperAsync(id)
                    refresh()
                    toastMessage = "已删除壁纸"
                }
            }

            fun importMedia(context: Context, uri: Uri) {
                viewModelScope.launch {
                    val res = VideoImportHelper.importMedia(context, uri)
                    if (res.success && res.item != null) {
                        repository.saveWallpaperAsync(res.item)
                        toastMessage = "导入成功：${res.item.name}"
                        refresh()
                        selectForPreview(res.item)
                    } else {
                        toastMessage = res.errorMessage ?: "导入失败"
                    }
                }
            }

            fun toggleAutoRotate(enabled: Boolean) {
                autoRotateEnabled = enabled
                repository.setAutoRotateEnabled(enabled)
            }

            fun setRotateInterval(min: Int) {
                rotateMinutes = min
                repository.setRotateMinutes(min)
            }

            fun toggleDoubleTap(enabled: Boolean) {
                doubleTapEnabled = enabled
                repository.setDoubleTapEnabled(enabled)
            }

            fun downloadOnlineVideo(url: String, title: String) {
                if (url.isBlank()) {
                    toastMessage = "请输入有效视频直链"
                    return
                }
                viewModelScope.launch {
                    isDownloading = true
                    val result = repository.downloadOnlineWallpaperAsync(url, title)
                    isDownloading = false
                    if (result.isSuccess) {
                        toastMessage = "下载成功并已导入壁纸库！"
                        refresh()
                        val item = result.getOrThrow()
                        selectForPreview(item)
                        applyWallpaper(item.id)
                    } else {
                        toastMessage = "下载失败，请检查网络或直链格式"
                    }
                }
            }
        }
