            var engineRef by remember { mutableStateOf<WallpaperEngine?>(null) }

            LaunchedEffect(viewModel.tuningScale, viewModel.tuningScaleMode) {
                engineRef?.updateCustomScale(viewModel.tuningScale, viewModel.tuningScaleMode)
            }
            LaunchedEffect(viewModel.tuningSpeed, viewModel.tuningVolume, viewModel.tuningMuted, viewModel.tuningGyroEnabled, viewModel.tuningTouchEnabled) {
                engineRef?.updateConfig(item.config)
            }

            LazyColumn(
                modifier = Modifier.fillMaxSize().padding(16.dp),
                verticalArrangement = Arrangement.spacedBy(14.dp)
            ) {
                item {
                    Text("当前预览：${item.name}", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                }

                item {
                    Box(
                        modifier = Modifier
                            .fillMaxWidth()
                            .height(260.dp)
                            .clip(RoundedCornerShape(14.dp))
                            .background(Color.Black),
                        contentAlignment = Alignment.Center
                    ) {
                        key(item.id) {
                            AndroidView(
                                factory = { ctx ->
                                    SurfaceView(ctx).apply {
                                        holder.addCallback(object : SurfaceHolder.Callback {
                                            override fun surfaceCreated(holder: SurfaceHolder) {
                                                val eng = when (item.type) {
                                                    WallpaperType.VIDEO -> VideoWallpaperEngine(ctx, item.path, item.config)
                                                    WallpaperType.SHADER -> {
                                                        val preset = item.path.removePrefix("shader://")
                                                        ShaderWallpaperEngine(preset, item.config)
                                                    }
                                                    else -> {
                                                        val sub = item.path.removePrefix("particle://")
                                                        ParticleWallpaperEngine(sub, item.config)
                                                    }
                                                }
                                                engineRef = eng
                                                eng.onCreate(holder, width, height)
                                                eng.updateCustomScale(viewModel.tuningScale, viewModel.tuningScaleMode)
                                                eng.onVisibilityChanged(true)
                                            }

                                            override fun surfaceChanged(holder: SurfaceHolder, f: Int, w: Int, h: Int) {
                                                engineRef?.onSurfaceChanged(w, h)
                                            }

                                            override fun surfaceDestroyed(holder: SurfaceHolder) {
                                                engineRef?.onDestroy()
                                                engineRef = null
                                            }
                                        })
                                    }
                                },
                                modifier = Modifier.fillMaxSize()
                            )
                        }
                    }
                }

                item {
                    Text("画面缩放比例: ${(viewModel.tuningScale * 100).toInt()}%", fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                    Slider(
                        value = viewModel.tuningScale,
                        onValueChange = { viewModel.updatePreviewParam(scale = it) },
                        valueRange = 0.5f..2.5f
                    )
                }

                if (item.type == WallpaperType.VIDEO) {
                    item {
                        Text("播放速度: ${String.format("%.2f", viewModel.tuningSpeed)}x", fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                        Slider(
                            value = viewModel.tuningSpeed,
                            onValueChange = { viewModel.updatePreviewParam(speed = it) },
                            valueRange = 0.25f..2.0f
                        )
                    }

                    item {
                        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                            Text("视频静音播放", fontSize = 14.sp)
                            Switch(
                                checked = viewModel.tuningMuted,
                                onCheckedChange = { viewModel.updatePreviewParam(muted = it) }
                            )
                        }
                    }
                }

                item {
                    Text("显示模式", fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                    Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        FilterChip(
                            selected = viewModel.tuningScaleMode == 0,
                            onClick = { viewModel.updatePreviewParam(mode = 0) },
                            label = { Text("居中铺满 (Crop)") }
                        )
                        FilterChip(
                            selected = viewModel.tuningScaleMode == 1,
                            onClick = { viewModel.updatePreviewParam(mode = 1) },
                            label = { Text("等比完整 (Fit)") }
                        )
                        FilterChip(
                            selected = viewModel.tuningScaleMode == 2,
                            onClick = { viewModel.updatePreviewParam(mode = 2) },
                            label = { Text("拉伸填充 (Stretch)") }
                        )
                    }
                }

                item {
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                        Text("陀螺仪视差响应", fontSize = 14.sp)
                        Switch(
                            checked = viewModel.tuningGyroEnabled,
                            onCheckedChange = { viewModel.updatePreviewParam(gyro = it) }
                        )
                    }
                }

                item {
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                        Text("桌面触控波纹/互动", fontSize = 14.sp)
                        Switch(
                            checked = viewModel.tuningTouchEnabled,
                            onCheckedChange = { viewModel.updatePreviewParam(touch = it) }
                        )
                    }
                }

                item {
                    Button(
                        onClick = { viewModel.applyWallpaper(item.id) },
                        modifier = Modifier.fillMaxWidth().height(48.dp),
                        shape = RoundedCornerShape(10.dp)
                    ) {
                        Text("设为当前正在运行的壁纸")
                    }
                }
            }
        }

        @Composable
        fun WallpaperLibraryScreen(viewModel: WallpaperViewModel, onPickMedia: () -> Unit) {
            var searchQuery by remember { mutableStateOf("") }
            var selectedFilter by remember { mutableStateOf("全部") }

            val filteredList = viewModel.allWallpapers.filter { item ->
                (searchQuery.isBlank() || item.name.contains(searchQuery, ignoreCase = true)) &&
                when (selectedFilter) {
                    "全部" -> true
                    "视频" -> item.type == WallpaperType.VIDEO
                    "粒子" -> item.type == WallpaperType.PARTICLE
                    "Shader" -> item.type == WallpaperType.SHADER
                    "图片" -> item.type == WallpaperType.IMAGE
                    "收藏" -> item.isFavorite
                    else -> true
                }
            }

            LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                item {
                    OutlinedButton(
                        onClick = onPickMedia,
                        modifier = Modifier.fillMaxWidth().height(46.dp),
                        shape = RoundedCornerShape(10.dp)
                    ) {
                        Text("📁 导入手机相册 (视频 / 图片)")
                    }
                }

                item {
                    OutlinedTextField(
                        value = searchQuery,
                        onValueChange = { searchQuery = it },
                        label = { Text("搜索本地壁纸名称...") },
                        modifier = Modifier.fillMaxWidth()
                    )
                }

                item {
                    Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                        listOf("全部", "视频", "粒子", "Shader", "收藏").forEach { filter ->
                            FilterChip(
                                selected = selectedFilter == filter,
                                onClick = { selectedFilter = filter },
                                label = { Text(filter) }
                            )
                        }
                    }
                }

                items(filteredList) { item ->
                    val isActive = item.id == viewModel.activeWallpaper.id
                    Card(
                        modifier = Modifier.fillMaxWidth(),
                        colors = CardDefaults.cardColors(
                            containerColor = if (isActive) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant
                        ),
                        shape = RoundedCornerShape(12.dp)
                    ) {
                        Column(modifier = Modifier.padding(14.dp)) {
                            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                Column(modifier = Modifier.weight(1f)) {
                                    Text(item.name, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                    Text("类别: ${item.category} | 类型: ${item.type.name}", fontSize = 12.sp, color = Color.Gray)
                                }
                                if (isActive) {
                                    Text("● 当前桌面", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                }
                            }
                            Spacer(modifier = Modifier.height(10.dp))
                            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Button(
                                    onClick = {
                                        viewModel.selectForPreview(item)
                                        viewModel.selectedTab = 0
                                    },
                                    modifier = Modifier.weight(1f),
                                    shape = RoundedCornerShape(8.dp)
                                ) {
                                    Text("实时预览 & 调参")
                                }
                                if (!isActive) {
                                    OutlinedButton(
                                        onClick = { viewModel.applyWallpaper(item.id) },
                                        shape = RoundedCornerShape(8.dp)
                                    ) {
                                        Text("应用")
                                    }
                                }
                                if (item.type == WallpaperType.VIDEO || item.type == WallpaperType.IMAGE) {
                                    OutlinedButton(
                                        onClick = { viewModel.deleteWallpaper(item.id) },
                                        shape = RoundedCornerShape(8.dp)
                                    ) {
                                        Text("删除")
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

