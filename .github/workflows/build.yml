        files['app/src/main/java/com/example/wallpaperengine/domain/media/VideoImportHelper.kt'] = '''package com.example.wallpaperengine.domain.media

        import android.content.Context
        import android.net.Uri
        import android.provider.OpenableColumns
        import com.example.wallpaperengine.domain.model.WallpaperConfig
        import com.example.wallpaperengine.domain.model.WallpaperItem
        import com.example.wallpaperengine.domain.model.WallpaperType
        import java.io.File
        import java.io.FileOutputStream

        object VideoImportHelper {

            data class ImportResult(
                val success: Boolean,
                val item: WallpaperItem? = null,
                val errorMessage: String? = null
            )

            fun importMedia(context: Context, sourceUri: Uri): ImportResult {
                val destDir = File(context.filesDir, "imported_wallpapers")
                if (!destDir.exists() && !destDir.mkdirs()) {
                    return ImportResult(false, null, "无法创建存储目录")
                }

                val mime = context.contentResolver.getType(sourceUri) ?: ""
                val isImage = mime.startsWith("image/")
                val ext = if (isImage) ".jpg" else ".mp4"
                val targetFile = File(destDir, "media_${System.currentTimeMillis()}$ext")

                try {
                    context.contentResolver.openInputStream(sourceUri)?.use { input ->
                        FileOutputStream(targetFile).use { output ->
                            val buf = ByteArray(32768)
                            var read: Int
                            while (input.read(buf).also { read = it } != -1) {
                                output.write(buf, 0, read)
                            }
                        }
                    } ?: return ImportResult(false, null, "读取文件流失败")
                } catch (e: Exception) {
                    if (targetFile.exists()) targetFile.delete()
                    return ImportResult(false, null, "导入失败: ${e.localizedMessage}")
                }

                var displayName = "本地媒体_${System.currentTimeMillis()}"
                try {
                    context.contentResolver.query(sourceUri, null, null, null, null)?.use { cursor ->
                        val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                        if (idx != -1 && cursor.moveToFirst()) {
                            displayName = cursor.getString(idx).substringBeforeLast(".")
                        }
                    }
                } catch (e: Exception) {}

                val item = WallpaperItem(
                    id = "local_${System.currentTimeMillis()}",
                    name = displayName,
                    path = targetFile.absolutePath,
                    thumbnailPath = null,
                    type = if (isImage) WallpaperType.IMAGE else WallpaperType.VIDEO,
                    category = "本地",
                    isFavorite = false,
                    lastUsedTime = System.currentTimeMillis(),
                    config = WallpaperConfig()
                )
                return ImportResult(true, item, null)
            }
        }
