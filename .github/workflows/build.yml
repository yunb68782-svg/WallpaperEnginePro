            @Test
            fun testSingleRenderLoopTokenDeduplication() {
                val renderLoopToken = "RENDER_LOOP_TOKEN"
                val queue = mutableListOf<String>()

                fun schedule(token: String) {
                    queue.removeAll { it == token }
                    queue.add(token)
                }

                repeat(5) { schedule(renderLoopToken) }

                assertEquals(1, queue.size)
                assertEquals(renderLoopToken, queue.first())
