                assertFalse("不存在的 ID 必须被拒绝写入", canSetActive)
            }

            @Test
            fun testSupportsCapabilitiesIntegrity() {
                val videoItem = WallpaperItem("v", "V", "p", null, WallpaperType.VIDEO, "C")
                val particleItem = WallpaperItem("p", "P", "p", null, WallpaperType.PARTICLE, "C")

                assertFalse("视频不应支持触摸流体", videoItem.supportsTouch)
